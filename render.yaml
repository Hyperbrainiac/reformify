services:
  - type: web
    name: reformify-landing
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: LANDING_PREVIEW
        value: "false"
      - key: CHECKOUT_MODO
        value: sandbox
      - key: CHECKOUT_PROVEDOR
        value: simulado
      # Segredos reais (nunca o valor aqui — só o nome). Preencher no
      # dashboard do Render depois que a credencial chegar via secret
      # proposal do Paperclip (ACE-6).
      - key: RESEND_API_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
